name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch the Muse Gadget SDK (Link transport for imports)
        run: |
          git clone --depth 1 https://github.com/facebookincubator/muse-gadget-sdk /tmp/sdk || \
          echo "SDK clone unavailable; SDK-dependent tests will be skipped by import guards"
      - name: Install
        run: |
          python -m pip install -e ".[test]"
          python -m pip install /tmp/sdk/linux || true
      - name: Test
        run: python -m pytest -q
        env:
          PYTHONPATH: /tmp/sdk/linux/src

  gnome:
    # The GNOME client and the daemon end to end, on the distro's own
    # GTK 4 / libadwaita (Ubuntu 24.04 ships libadwaita 1.5).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: System packages
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends \
            python3-venv python3-gi gir1.2-gtk-4.0 gir1.2-adw-1 \
            xvfb shellcheck
      - name: Fetch the Muse Gadget SDK
        run: git clone --depth 1 https://github.com/facebookincubator/muse-gadget-sdk /tmp/sdk
      - name: Install
        run: |
          /usr/bin/python3 -m venv --system-site-packages .venv
          .venv/bin/pip install -q /tmp/sdk/linux
          .venv/bin/pip install -q -e ".[test]"
      - name: Daemon, client and GNOME tests (headless X)
        run: xvfb-run -a .venv/bin/python -m pytest -q tests/test_daemon.py tests/test_gnome_model.py tests/test_gnome_ui.py
      - name: Installer
        run: |
          shellcheck install.sh
          ./install.sh --dry-run --user runner

  gui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: gui/package-lock.json
      - name: Install and build
        working-directory: gui
        run: |
          npm ci --no-audit --no-fund
          npm run build
