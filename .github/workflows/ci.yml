name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch the Muse Gadget SDK (Link transport for imports)
        run: |
          git clone --depth 1 https://github.com/facebookincubator/muse-gadget-sdk /tmp/sdk || \
          echo "SDK clone unavailable; SDK-dependent tests will be skipped by import guards"
      - name: Install
        run: |
          python -m pip install -e ".[test]"
          python -m pip install /tmp/sdk/linux || true
      - name: Test
        run: python -m pytest -q
        env:
          PYTHONPATH: /tmp/sdk/linux/src

  gui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: gui/package-lock.json
      - name: Install and build
        working-directory: gui
        run: |
          npm ci --no-audit --no-fund
          npm run build
